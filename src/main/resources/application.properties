# Database Configuration
spring.datasource.url=jdbc:postgresql://${DATABASE_HOST}:5432/${DATABASE_NAME}
spring.datasource.username=${DATABASE_USER}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# Activer Swagger
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Chemin d'accès à Swagger UI (correct selon la version de Springdoc)
springdoc.swagger-ui.path=/swagger-ui.html

# Changer l'URL de la documentation OpenAPI JSON
springdoc.api-docs.path=/api-docs

# Désactiver la bannière au démarrage (optionnel)

spring.main.banner-mode=off

